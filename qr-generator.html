<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Generator - Internet Tools Hub</title>

    <meta
        name="description"
        content="Create QR codes instantly from text or URLs with Internet Tools Hub."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav>

        <a href="index.html" class="logo">
            Internet Tools Hub
        </a>

        <ul class="nav-links">
            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="qr-generator.html" class="active">
                    QR Generator
                </a>
            </li>
        </ul>

    </nav>
</header>


<main>

    <!-- Hero -->

    <section class="hero">

        <span class="badge">
            Free Tool
        </span>

        <h1>
            QR Code Generator
        </h1>

        <p>
            Create QR codes instantly from any text or URL.
            Free, fast and easy to use.
        </p>

    </section>


    <!-- QR Generator -->

    <section class="generator-section">

        <div class="card">

            <div class="input-group">

                <label for="input-text">
                    Enter text or URL
                </label>

                <textarea
                    id="input-text"
                    placeholder="Type or paste your text or URL here..."
                    rows="4"
                    aria-describedby="error-msg"
                ></textarea>

                <p
                    id="error-msg"
                    class="error-msg"
                    role="alert"
                    aria-live="assertive"
                ></p>

            </div>


            <!-- Buttons -->

            <div class="action-buttons">

                <button
                    id="generate-btn"
                    type="button"
                >
                    Generate QR Code
                </button>

                <button
                    id="clear-btn"
                    type="button"
                    class="btn-secondary"
                >
                    Clear
                </button>

            </div>


            <div
                class="divider"
                aria-hidden="true"
            ></div>


            <!-- Preview -->

            <div class="preview-area">

                <div
                    id="qr-placeholder"
                    class="qr-placeholder"
                >
                    <p>
                        Your QR code will appear here
                    </p>
                </div>


                <div
                    id="qr-container"
                    class="qr-container"
                    aria-live="polite"
                ></div>

            </div>


            <!-- Download -->

            <button
                id="download-btn"
                type="button"
                class="btn-download"
                disabled
            >
                Download QR Code
            </button>

        </div>

    </section>

</main>


<footer>

    <div class="footer-content">

        <p>
            © 2026 Internet Tools Hub
        </p>

        <p>
            Made by
            <a
                href="https://mrcodex1241.pythonanywhere.com"
                target="_blank"
                rel="noopener noreferrer"
            >
                Mr. CodeX
            </a>
        </p>

    </div>

</footer>


<!-- QR Code Library -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- QR Generator JavaScript -->

<script src="script.js"></script>

</body>
</html>
